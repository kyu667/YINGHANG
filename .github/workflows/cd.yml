name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.head_commit.author.name != 'github-actions[bot]'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            APP="bank-predict"
            PORT=8004
            PORT_MAX=8010
            CONTAINER_PORT=8501
            WORK_DIR="/opt/bank-predict"

            mkdir -p "$WORK_DIR"

            # Move repo content if it exists
            if [ -d "$WORK_DIR/.git" ]; then
              cd "$WORK_DIR" && git pull
            else
              git clone https://github.com/kyu667/YINGHANG.git "$WORK_DIR"
            fi

            cd "$WORK_DIR"

            pip install -r requirements.txt -r requirements-dev.txt -i https://pypi.tuna.tsinghua.edu.cn/simple
            python -m app.ml.train

            # port fallback
            port_in_use() {
              ss -ltnH 2>/dev/null | grep -q ":$1 " && return 0
              docker ps --format "{{.Ports}}" 2>/dev/null | grep -q ":$1->" && return 0
              return 1
            }
            HOST_PORT=""
            for p in $(seq $PORT $PORT_MAX); do
              if ! port_in_use "$p"; then HOST_PORT="$p"; break; fi
            done
            [ -z "$HOST_PORT" ] && { echo "端口区间已占满，部署中止"; exit 1; }
            echo ">> 部署到主机端口 $HOST_PORT"

            docker build --build-arg PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple -t "$APP":latest .
            docker rm -f "$APP" 2>/dev/null || true
            docker run -d --name "$APP" --restart unless-stopped -p "${HOST_PORT}:${CONTAINER_PORT}" "$APP":latest

            sleep 3
            curl -fsS "http://localhost:${HOST_PORT}/_stcore/health"
            echo ">> 部署成功: http://${{ secrets.SSH_HOST }}:${HOST_PORT}"
