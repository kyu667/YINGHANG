[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["claude_code"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"app/pages/*.py" = ["N999"]
"app/ml/train.py" = ["N806"]
"tests/*.py" = ["N802"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=app/models --cov=app/ml --cov-fail-under=80 --cov-report=term"

[tool.coverage.run]
omit = ["app/ml/train.py"]
